<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试插件 iframe 加载</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .controls {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 4px;
        }
        
        button {
            padding: 8px 16px;
            background: #3a84ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        
        button:hover {
            background: #4e94ff;
        }
        
        .iframe-wrapper {
            border: 2px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            background: white;
        }
        
        iframe {
            width: 100%;
            height: 500px;
            border: 1px solid #e0e0e0;
            border-radius: 2px;
        }
        
        .info {
            margin-top: 15px;
            padding: 10px;
            background: #e7f3ff;
            border-left: 3px solid #3a84ff;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .status {
            margin-top: 10px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 BKCI 插件 iframe 测试工具</h1>
        
        <div class="controls">
            <button onclick="sendInitData()">📤 发送初始化数据 (模拟平台)</button>
            <button onclick="reloadIframe()">🔄 重新加载 iframe</button>
        </div>
        
        <div class="info">
            <strong>使用说明：</strong><br>
            1. 页面加载后，iframe 会显示空白（这是正常的）<br>
            2. 点击 "发送初始化数据" 按钮，模拟平台向插件发送数据<br>
            3. 如果插件正常，会立即显示表单界面<br>
            4. 如果还是空白，说明 JS 文件加载或执行有问题
        </div>
        
        <div class="iframe-wrapper">
            <iframe id="plugin-iframe" src="./dist/index.html"></iframe>
        </div>
        
        <div class="status" id="status">
            等待操作...
        </div>
    </div>

    <script>
        const iframe = document.getElementById('plugin-iframe');
        const statusDiv = document.getElementById('status');
        
        // 监听来自 iframe 的消息
        window.addEventListener('message', (e) => {
            console.log('收到 iframe 消息:', e.data);
            if (e.data.iframeHeight) {
                statusDiv.innerHTML += `<br>[${new Date().toLocaleTimeString()}] iframe 高度变化: ${e.data.iframeHeight}px`;
                // 动态调整 iframe 高度
                iframe.style.height = e.data.iframeHeight + 'px';
            }
        });
        
        // 模拟平台发送初始化数据到 iframe
        function sendInitData() {
            const initData = {
                // 插件的值（从后端加载或用户之前保存的）
                atomPropsValue: {
                    server: '',
                    token: ''
                },
                // task.json 的 input 部分
                atomPropsModel: {
                    server: {
                        label: "SAST服务器",
                        type: "text",
                        component: "vuex-input"
                    },
                    token: {
                        label: "Token",
                        type: "text",
                        component: "vuex-input"
                    }
                },
                // 容器信息
                containerInfo: {
                    baseOS: 'LINUX',
                    dispatchType: {
                        buildType: "DOCKER",
                        imageCode: "tlinux2_2",
                        imageName: "TLinux2.2公共镜像",
                        imageType: "BKSTORE",
                        imageVersion: "1.*",
                        value: "tlinux2_2"
                    }
                },
                // 当前用户信息
                currentUserInfo: {
                    userName: 'testuser',
                    chineseName: '测试用户'
                },
                // 是否禁用编辑
                atomDisabled: false,
                // 环境配置
                envConf: {}
            };
            
            // 发送数据到 iframe
            iframe.contentWindow.postMessage(initData, '*');
            
            statusDiv.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ✅ 已发送初始化数据到 iframe`;
            console.log('发送初始化数据:', initData);
        }
        
        // 重新加载 iframe
        function reloadIframe() {
            iframe.src = iframe.src;
            statusDiv.innerHTML += `<br>[${new Date().toLocaleTimeString()}] 🔄 重新加载 iframe`;
        }
        
        // iframe 加载完成后的提示
        iframe.onload = function() {
            statusDiv.innerHTML += `<br>[${new Date().toLocaleTimeString()}] iframe 已加载完成，现在可以点击 "发送初始化数据" 按钮`;
        };
    </script>
</body>
</html>
